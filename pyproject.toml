[project]
name = "integrasi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "dj-database-url>=2.1",
    "nh3>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
