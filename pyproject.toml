[project]
name = "integrasi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "dj-database-url>=2.1",
    "nh3>=0.2",
    # Servidor de aplicacao em producao (spec 13); nao e usado em desenvolvimento.
    "gunicorn>=23.0",
]

# O IntegraSI e uma aplicacao, e nao uma biblioteca: `pip install -e .` existe so
# para trazer as dependencias declaradas acima, e nada aqui e importado como
# pacote instalado (o `manage.py` e o gunicorn acham `apps` e `config` pelo
# diretorio de trabalho).
#
# Sem esta linha o setuptools tenta descobrir pacotes sozinho no layout plano,
# encontra `apps`, `deploy`, `config`, `static` e `templates` no topo, e se recusa
# a continuar: "Multiple top-level packages discovered in a flat-layout". Numa
# maquina de desenvolvimento que ja tinha o ambiente pronto isso nunca aparece;
# numa instalacao limpa - a do servidor, seguindo docs/operacao.md 1.3 - o
# comando falha e nada e instalado.
[tool.setuptools]
py-modules = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["error"]
