# IntegraSI - nginx na frente do gunicorn (spec 13).
# Copiar para /etc/nginx/sites-available/integrasi e ligar em sites-enabled.
# Depois de instalar, rodar as duas conferencias de docs/operacao.md: elas sao a
# unica prova de que o servidor no ar roda ISTO -- a suite so conhece o arquivo
# versionado aqui.

server {
    # Forma compativel com nginx < 1.25.1 (Ubuntu 22.04 traz 1.18; 24.04, 1.24).
    # Em 1.25.1+ ela vira aviso de descontinuada e o equivalente e `listen 443 ssl;`
    # com `http2 on;` numa linha propria -- que, ao contrario, NAO existe nas
    # versoes antigas e derruba o nginx no reload.
    listen 443 ssl http2;
    server_name integrasi.ufsm.br;

    ssl_certificate     /etc/ssl/certs/integrasi.crt;
    ssl_certificate_key /etc/ssl/private/integrasi.key;

    # Um bloco de upload de video tem 5 MB; a folga cobre os demais anexos.
    # Precisa ser >= DATA_UPLOAD_MAX_MEMORY_SIZE do Django, senao o nginx corta
    # antes com 413 e o navegador nunca ve a mensagem da aplicacao.
    client_max_body_size 60M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;

    location /static/ {
        alias /srv/integrasi/staticfiles/;
        expires 30d;
    }

    # Entrega dos materiais. INTERNAL: so o Django, depois de checar a permissao,
    # consegue apontar para ca com X-Accel-Redirect. Sem esta diretiva, qualquer
    # pessoa com a URL baixa material nao aprovado (spec 8, 10) e a view de
    # permissao vira enfeite. E a pior configuracao errada possivel deste deploy.
    # O `alias` tem que ser exatamente o MEDIA_ROOT do settings, com a barra final.
    location /protegido/ {
        internal;
        alias /srv/integrasi/media/;
    }

    # Nao existe `location /media/` de proposito: o MEDIA_ROOT nao pode ser
    # alcancavel por nenhuma outra rota (spec 10). Se alguem acrescentar uma,
    # todo o controle de acesso a material em producao cai junto.

    # A verificacao de saude cai no `location /` como o resto e nao precisa de
    # bloco proprio. Se a monitoracao vier de um IP conhecido e voce quiser
    # fechar a rota para o resto do mundo, o lugar e aqui:
    #
    #     location = /saude/ {
    #         allow 10.0.0.0/8;
    #         deny all;
    #         proxy_pass http://127.0.0.1:8000;
    #         proxy_set_header Host $host;
    #     }
    #
    # Fechar nao e obrigatorio: a rota responde "ok" ou "sem banco", e nao conta
    # nada que nao se saiba de fora.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SOBRESCREVE, nao acrescenta. $proxy_add_x_forwarded_for -- que era o
        # obvio aqui -- anexa o IP real ao que o CLIENTE mandou, e o cabecalho
        # chega ao Django como "9.9.9.9, <ip real>". O limite por IP do
        # formulario publico (spec 10) precisa de um valor que o cliente nao
        # escreva; com $remote_addr o cabecalho tem um elemento so, e ele e
        # nosso. O Django ainda le o ULTIMO elemento por seguranca: as duas
        # camadas teriam que estar erradas ao mesmo tempo para a cota ser
        # burlada.
        proxy_set_header X-Forwarded-For $remote_addr;

        # SECURE_PROXY_SSL_HEADER depende deste cabecalho. Sem ele o Django acha
        # que a requisicao e http, SECURE_SSL_REDIRECT devolve 301 para https, o
        # nginx repassa de novo, e o navegador entra em laco de redirecionamento.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name integrasi.ufsm.br;
    return 301 https://$host$request_uri;
}
