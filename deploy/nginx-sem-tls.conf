# IntegraSI - nginx SEM TLS, atendendo por IP.
#
# VARIANTE TEMPORARIA. A configuracao de producao e `nginx.conf`, ao lado: esta
# existe porque o servidor subiu antes de haver DNS para `integrasi.ufsm.br` e,
# sem dominio, nao ha certificado valido possivel - certificado para endereco IP
# nao e emitido por autoridade nenhuma.
#
# ENQUANTO ISTO ESTIVER NO AR, a senha de login e o CPF trafegam em texto claro.
# Vale para teste e uso interno; nao vale para uso aberto.
#
# Para trocar quando o dominio existir:
#   1. `SEGURANCA_HTTPS=True` e o dominio em `ALLOWED_HOSTS`, no .env
#   2. instalar `nginx.conf` no lugar deste
#   3. `nginx -t && systemctl reload nginx` e `systemctl restart integrasi`
#
# O que NAO muda entre as duas: o `internal;` da midia, o alias do /static/, o
# teto de corpo e a sobrescrita do X-Forwarded-For. Sao as quatro coisas que
# sustentam permissao, upload e limite por IP.

server {
    listen 80;
    server_name 200.132.38.187;

    # Um bloco de upload de video tem 5 MB; a folga cobre os demais anexos.
    # Precisa ser >= DATA_UPLOAD_MAX_MEMORY_SIZE do Django, senao o nginx corta
    # antes com 413 e o navegador nunca ve a mensagem da aplicacao.
    client_max_body_size 60M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;

    location /static/ {
        alias /srv/integrasi/staticfiles/;
        expires 30d;
    }

    # Entrega dos materiais. INTERNAL: so o Django, depois de checar a permissao,
    # consegue apontar para ca com X-Accel-Redirect. Sem esta diretiva, qualquer
    # pessoa com a URL baixa material nao aprovado (spec 8, 10) e a view de
    # permissao vira enfeite. E a pior configuracao errada possivel deste deploy.
    # O `alias` tem que ser exatamente o MEDIA_ROOT do settings, com a barra final.
    location /protegido/ {
        internal;
        alias /srv/integrasi/media/;
    }

    # Nao existe `location /media/` de proposito: o MEDIA_ROOT nao pode ser
    # alcancavel por nenhuma outra rota (spec 10). Se alguem acrescentar uma,
    # todo o controle de acesso a material em producao cai junto.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SOBRESCREVE, nao acrescenta - ver a nota extensa em nginx.conf. O
        # limite por IP do formulario publico (spec 10) precisa de um valor que o
        # cliente nao escreva.
        proxy_set_header X-Forwarded-For $remote_addr;

        # Continua sendo repassado, e vale "http" aqui. Com SEGURANCA_HTTPS=False
        # o Django nao redireciona, entao nao ha laco; quando o TLS entrar, este
        # cabecalho ja estara no lugar certo.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
