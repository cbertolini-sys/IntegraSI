{% extends "base.html" %}
{% block titulo %}Entrar &mdash; IntegraSI{% endblock %}
{% block conteudo %}
  <h1>Entrar</h1>
  {% if form.errors %}<p>E-mail ou senha incorretos.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
